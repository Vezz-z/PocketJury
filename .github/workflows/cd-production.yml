# ==============================================================================
# PocketJury — CD Pipeline (Production)
# ==============================================================================
name: Deploy Production

on:
  push:
    tags:
      - 'v*'

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check deployment prerequisites
        id: preflight
        run: |
          missing=()
          [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] && missing+=("AWS_ACCOUNT_ID")
          [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] && missing+=("AWS_DEPLOY_ROLE_ARN")
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && missing+=("DEPLOY_HOST")
          [ -z "${{ secrets.DEPLOY_USER }}" ] && missing+=("DEPLOY_USER")
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && missing+=("DEPLOY_SSH_KEY")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "missing=$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping production deployment. Missing required secrets: ${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.preflight.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.preflight.outputs.ready == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        if: steps.preflight.outputs.ready == 'true'
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build & push API image
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/pocketjury-api:${{ steps.version.outputs.VERSION }}
            ${{ env.ECR_REGISTRY }}/pocketjury-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push AI image
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/pocketjury-ai:${{ steps.version.outputs.VERSION }}
            ${{ env.ECR_REGISTRY }}/pocketjury-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        if: steps.preflight.outputs.ready == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/pocketjury-web:${{ steps.version.outputs.VERSION }}
            ${{ env.ECR_REGISTRY }}/pocketjury-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        if: steps.preflight.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pocketjury
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      - name: Report skipped deployment reason
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "::error::Missing required secrets for production deployment: ${{ steps.preflight.outputs.missing }}"
          exit 1

      - name: Notify deployment
        if: always()
        run: |
          STATUS=${{ job.status }}
          echo "Deployment $STATUS for version ${{ steps.version.outputs.VERSION }}"
