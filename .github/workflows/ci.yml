# ==============================================================================
# PocketJury — CI Pipeline
# ==============================================================================
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------- Lint & Type Check ----------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Lint
        run: npm run lint

      - name: Type check (API)
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Type check (Web)
        working-directory: apps/web
        run: npx tsc --noEmit

  # ---------- API Tests ----------
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pocketjury_test
          POSTGRES_USER: pocketjury
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pocketjury"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://pocketjury:test_password@localhost:5432/pocketjury_test
        run: |
          npx prisma db push --skip-generate
          npx prisma db execute --file prisma/migrations/10_pgvector_setup/migration.sql --schema prisma/schema.prisma

      - name: Run tests
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://pocketjury:test_password@localhost:5432/pocketjury_test
          REDIS_URL: redis://localhost:6379
          JWT_PUBLIC_KEY: test-public-key
          JWT_PRIVATE_KEY: test-private-key
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/

  # ---------- AI Service Tests ----------
  test-ai:
    name: Test AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: services/ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Lint with ruff
        working-directory: services/ai
        run: |
          pip install ruff
          ruff check .

      - name: Run tests
        working-directory: services/ai
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///test.db
          REDIS_URL: redis://localhost:6379
        run: pytest --cov=app --cov-report=xml -v

  # ---------- Frontend Tests ----------
  test-web:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Run tests
        working-directory: apps/web
        run: npm test -- --coverage --watchAll=false

  # ---------- Docker Build ----------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-api, test-ai, test-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/ai/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Security Scan ----------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: npm audit
        run: npm audit --audit-level=high || true
