<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Balance Scale Favicon for PocketJury -->
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3A5C"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#g)"/>
  <!-- Scale icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center pillar -->
    <line x1="16" y1="8" x2="16" y2="25"/>
    <!-- Base -->
    <line x1="12" y1="25" x2="20" y2="25"/>
    <!-- Beam -->
    <line x1="7" y1="12" x2="25" y2="12"/>
    <!-- Left pan hanger -->
    <line x1="7" y1="12" x2="7" y2="14"/>
    <line x1="7" y1="14" x2="5" y2="14"/>
    <line x1="7" y1="14" x2="9" y2="14"/>
    <!-- Left pan (bowl) -->
    <path d="M5 14 Q5 18 7 18 Q9 18 9 14"/>
    <!-- Right pan hanger -->
    <line x1="25" y1="12" x2="25" y2="14"/>
    <line x1="25" y1="14" x2="23" y2="14"/>
    <line x1="25" y1="14" x2="27" y2="14"/>
    <!-- Right pan (bowl) -->
    <path d="M23 14 Q23 18 25 18 Q27 18 27 14"/>
    <!-- Top knob -->
    <circle cx="16" cy="8" r="1.5" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
