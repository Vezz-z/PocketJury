# ==============================================================================
# PocketJury — Docker Compose (Production)
# ==============================================================================

services:
  # ---------- Nginx Reverse Proxy ----------
  nginx:
    image: nginx:1.25-alpine
    container_name: pocketjury-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api

  # ---------- PostgreSQL 16 + pgvector ----------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pocketjury-postgres
    restart: always
    environment:
      POSTGRES_DB: pocketjury
      POSTGRES_USER: pocketjury
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pocketjury']
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: pocketjury-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------- API Gateway ----------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pocketjury-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://pocketjury:${POSTGRES_PASSWORD}@postgres:5432/pocketjury
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_SERVICE_URL: http://ai:8000
      CORS_ORIGINS: https://${DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SENTRY_DSN: ${SENTRY_DSN}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # ---------- AI Service ----------
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: pocketjury-ai
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://pocketjury:${POSTGRES_PASSWORD}@postgres:5432/pocketjury
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID}
      LEGAL_EMBEDDING_MODEL: ${LEGAL_EMBEDDING_MODEL}
      QUERY_EMBEDDING_MODEL: ${QUERY_EMBEDDING_MODEL}
      SENTRY_DSN: ${SENTRY_DSN}
    volumes:
      - model-cache:/root/.cache
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: '2'

  # ---------- Next.js Frontend ----------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pocketjury-web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: https://${DOMAIN}/api/v1
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  pgdata:
  redisdata:
  model-cache:
