# ==============================================================================
# PocketJury — Prometheus Alert Rules
# ==============================================================================

groups:
  - name: pocketjury_critical
    rules:
      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been down for more than 1 minute."

      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is above 5% for 5 minutes."

      # Database connection pool exhausted
      - alert: DBConnectionPoolExhausted
        expr: pg_stat_activity_count > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"

  - name: pocketjury_warning
    rules:
      # High latency on AI queries
      - alert: HighAILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(rag_query_duration_seconds_bucket[5m])) by (le)
          ) > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI query latency P95 > 15s"
          description: "RAG pipeline P95 latency exceeds 15 seconds."

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage above 85%"

      # Disk space low
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15%"

      # Redis memory high
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage above 80%"

      # Too many rate-limited requests
      - alert: HighRateLimiting
        expr: |
          sum(rate(rate_limited_requests_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of rate-limited requests"

      # Safety filter triggers
      - alert: HighSafetyBlocks
        expr: |
          sum(rate(rag_safety_blocks_total[5m])) > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High rate of safety filter blocks"
          description: "Investigate potential abuse or false positives."
