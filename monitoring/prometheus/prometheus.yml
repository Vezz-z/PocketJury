# ==============================================================================
# PocketJury — Prometheus Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/alert_rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # API Gateway health (no Prometheus metrics endpoint yet)
  - job_name: 'pocketjury-api'
    metrics_path: '/health'
    scrape_interval: 30s
    static_configs:
      - targets: ['api:4000']
        labels:
          service: 'api-gateway'

  # AI Service metrics (Prometheus instrumented)
  - job_name: 'pocketjury-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai:8000']
        labels:
          service: 'ai-service'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Node exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'host'

  # Nginx exporter
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
